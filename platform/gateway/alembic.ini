[alembic]
script_location = src/fathom_gateway/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# 09-monorepo-and-conventions.md §7.3: "<utc_timestamp>_<slug>_<short_description>.py"
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_gateway_%%(slug)s

# sqlalchemy.url intentionally NOT set here -- env.py reads it from
# Settings (FATHOM_DATABASE__URL), the same single source of truth the
# running service uses (09-monorepo-and-conventions.md §4.5: config.py is
# the only module that reads the environment). A hard-coded URL here would
# be a second, driftable source of truth.

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
