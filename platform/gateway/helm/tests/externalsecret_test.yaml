# 09-monorepo-and-conventions.md §4.5: the three genuinely secret values
# (FATHOM_DATABASE__URL, FATHOM_OIDC__CLIENT_SECRET,
# FATHOM_SESSION__COOKIE_SIGNING_KEY) arrive as env vars projected from
# External Secrets-managed Secrets -- never a file path in the chart, never
# a value in values.yaml. Three ExternalSecrets render: the app's own DB
# role, a DISTINCT owner-privilege DB role for the migration Job, and one
# more for the two non-database app secrets (see values.yaml's own
# `secrets:` comment for why those two share one Secret).
#
# GOTCHA (recorded in this repo's own CLAUDE.md, reproduced here since it
# bit this exact suite while writing it): helm-unittest v1.1.2 silently
# ignores a per-ASSERTION `documentIndex` field against a multi-document
# template -- it must be set at the TEST-CASE (`it:`) level, sibling to
# `asserts:`, or every assertion below silently resolves against document 0
# regardless of which one was intended, with no error. Every `it:` below
# that targets a specific document sets `documentIndex` at that level.
suite: ExternalSecret projects three secret values across three documents -- DB app role, DB migration role, and app secrets kept distinct
templates:
  - externalsecret.yaml
tests:
  - it: first document is an ExternalSecret targeting database.secretRef, sourced from the fathom-vault SecretStore
    documentIndex: 0
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1beta1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: fathom-gateway-pg-app
      - equal:
          path: spec.secretStoreRef
          value:
            name: fathom-vault
            kind: SecretStore
      - equal:
          path: spec.target.name
          value: fathom-gateway-pg-app
      - equal:
          path: spec.data[0].secretKey
          value: FATHOM_DATABASE__URL
      - notExists:
          path: spec.data[0].value

  - it: second document is a distinct ExternalSecret for the migration Job's owner-privilege role, from a different Vault path
    documentIndex: 1
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: fathom-gateway-pg-migrate
      - equal:
          path: spec.target.name
          value: fathom-gateway-pg-migrate
      - notEqual:
          path: spec.data[0].remoteRef.key
          value: fathom/data/gateway/database

  - it: third document is the app-secrets ExternalSecret, with both oidc client_secret and session cookie_signing_key as separate data entries in ONE Secret
    documentIndex: 2
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: fathom-gateway-app-secrets
      - equal:
          path: spec.target.name
          value: fathom-gateway-app-secrets
      - lengthEqual:
          path: spec.data
          count: 2
      - equal:
          path: spec.data[0].secretKey
          value: FATHOM_OIDC__CLIENT_SECRET
      - equal:
          path: spec.data[1].secretKey
          value: FATHOM_SESSION__COOKIE_SIGNING_KEY
      - notEqual:
          path: spec.data[0].remoteRef.key
          value: spec.data[1].remoteRef.key

  - it: follows database.secretRef when overridden, not a hardcoded name
    documentIndex: 0
    set:
      database.secretRef: some-other-secret-name
    asserts:
      - equal:
          path: metadata.name
          value: some-other-secret-name
      - equal:
          path: spec.target.name
          value: some-other-secret-name

  - it: skips the migration ExternalSecret entirely when migrations.enabled is false -- no migration Job, no need for its Secret -- but keeps the app-secrets one, since it's independent of migrations
    set:
      migrations.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: renders nothing at all when externalSecret.enabled is false
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0
