{{/*
09-monorepo-and-conventions.md §4.4.2 -- parameterized by chart name/values,
like every other service's. Do not add a hard-coded peer; the rendered
egress peer set must equal values.networkPolicy.egress exactly and contain
nothing else (the CI-testable invariant this doc calls mandatory, asserted
in tests/).

Differs from services/pdm/helm's own networkpolicy.yaml in three ways, all
because gateway's real dependencies differ (see values.yaml's own header
comment and its two [JUDGMENT CALL] notes):
  - no toEventBus block -- gateway has no fathom-sync/Redpanda dependency
    at all (unlike every domain service, including PdM).
  - no toKeyService/toObjectStore blocks -- 09 §4.4.2 restricts
    toKeyService to `audit` alone and toObjectStore to six named services,
    none of which is `gateway`; rendering an always-false key for an edge
    gateway will never have would be dead weight, not a real toggle.
  - a NEW toOidcIssuer block -- gateway's own oidc.py calls Keycloak
    directly (authorize/token/revoke endpoints), a real egress dependency
    no other service's chart has. See values.yaml's own [ESTABLISHED HERE]
    comment for the selector/port choice.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fathom.fullname" . }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fathom.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.networkPolicy.ingress.fromServices }}
    - from:
        - podSelector:
            matchLabels: { fathom.navy/service: {{ . }} }
      ports: [{ protocol: TCP, port: 8000 }]
    {{- end }}
    {{- range .Values.networkPolicy.ingress.fromNamespaces }}
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
      ports: [{ protocol: TCP, port: 8000 }]
    {{- end }}
    {{- if .Values.networkPolicy.ingress.allowPrometheusScrape }}
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ protocol: TCP, port: 8000 }]
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- end }}
    {{- if .Values.networkPolicy.egress.toOwnDatabase }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: fathom-data } }
          podSelector:
            matchLabels: { cnpg.io/cluster: {{ .Values.database.clusterName }} }
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
    {{- if .Values.networkPolicy.egress.toOidcIssuer }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports: [{ protocol: TCP, port: 8443 }]
    {{- end }}
    {{- range .Values.networkPolicy.egress.toServices }}
    - to:
        - podSelector:
            matchLabels: { fathom.navy/service: {{ . }} }
      ports: [{ protocol: TCP, port: 8000 }]
    {{- end }}
    {{- range .Values.networkPolicy.egress.toNamespaces }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
    {{- end }}
