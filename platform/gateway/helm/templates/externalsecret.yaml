{{/*
09-monorepo-and-conventions.md §4.5: secrets arrive as environment variables
projected from an External Secrets-managed Secret -- never a file path in
the chart, never a value in values.yaml. This service has THREE genuinely
secret values, not one: FATHOM_DATABASE__URL (a full DSN, same shape as
every other service), plus two gateway-specific ones config.py's own
docstrings call out explicitly as secret -- OidcSettings.client_secret ("the
gateway's own confidential-client credential") and
SessionSettings.cookie_signing_key ("signs the short-lived PKCE/state
cookie"). Everything else is in configmap.yaml.

Backend assumed here: HashiCorp Vault via a SecretStore named `fathom-vault`
in this namespace -- identical assumption to services/pdm/helm's own
externalsecret.yaml (not specified by any build doc as of this writing;
concrete choice made here, matching PdM's, so the chart has something real
to render and lint). Vault path prefix (`fathom/data/<slug>/...`) reuses
PdM's own established convention verbatim, even though "data" reads oddly
for a Sustainment Plane service's own secrets -- it's a Vault KV mount
name, not a Kubernetes namespace reference, and inventing a second prefix
convention (e.g. "fathom/sustainment/...") for no documented reason would
be a needless inconsistency between the only two charts that exist.

Renders THREE ExternalSecrets:
  1. database.secretRef (`.../database`) -- the app's own DB role.
  2. database.migrationSecretRef (`.../database-migration`), gated on
     migrations.enabled -- a DISTINCT DB role for the migration Job. See
     migration-job.yaml's own docstring for why this split exists even
     though (unlike PdM) this schema has no RLS/BYPASSRLS requirement.
  3. secrets.appSecretRef (`.../oidc` + `.../session`) -- [JUDGMENT CALL,
     see values.yaml's own comment on `secrets:`] ONE Secret, TWO keys
     (FATHOM_OIDC__CLIENT_SECRET, FATHOM_SESSION__COOKIE_SIGNING_KEY),
     rendered as one ExternalSecret CR with two `data` entries pointing at
     two different Vault paths -- not two separate Secrets/ExternalSecrets,
     since both values are consumed by the same one Deployment and neither
     is ever needed by the migration Job (unlike the DB credential's real
     app-vs-migration privilege split, there is no privilege reason to
     split these two).

externalSecret.enabled defaults true (every real environment has the
External Secrets Operator's CRDs installed, per the assumption above) --
false is an escape hatch for an environment that doesn't have them yet
(e.g. a smoke-test sandbox with the Secrets created by hand), not a real
deployment's normal path. Gates all three documents together, matching
PdM's own single top-level toggle.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.database.secretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_DATABASE__URL
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/database
        property: url
{{- if .Values.migrations.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.migrationSecretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.database.migrationSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_DATABASE__URL
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/database-migration
        property: url
{{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.appSecretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.secrets.appSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_OIDC__CLIENT_SECRET
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/oidc
        property: client_secret
    - secretKey: FATHOM_SESSION__COOKIE_SIGNING_KEY
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/session
        property: signing_key
{{- end }}
