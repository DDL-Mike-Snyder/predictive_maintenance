{{/*
Prometheus Operator ServiceMonitor. Scrape is additionally gated at the
network layer by networkPolicy.ingress.allowPrometheusScrape
(networkpolicy.yaml); this resource is what actually configures Prometheus
to reach it. /metrics is wired from fathom_py_common's install_health_routes
(main.py), same as every other service.

serviceMonitor.enabled defaults true (every real environment has the
Prometheus Operator's CRDs installed) -- false is an escape hatch for an
environment that doesn't (e.g. a smoke-test sandbox), not a real
deployment's normal path.
*/}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "fathom.fullname" . }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "fathom.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
