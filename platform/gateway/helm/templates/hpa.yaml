{{/*
09-monorepo-and-conventions.md §4.4.1: autoscaling.mode is hpa | keda | none.
Gateway's HTTP path (this chart's only Deployment) is a synchronous
request/response BFF, same shape as PdM, so it gets an HPA rather than a
KEDA ScaledObject. `none` (used by values-dev.yaml) renders nothing -- dev
runs a fixed replicaCount. `keda` is left available in the enum (see
values.yaml's own autoscaling comment) for a future `gateway-projector`
Deployment this chart does not render yet -- not wired to anything today.
*/}}
{{- if eq .Values.autoscaling.mode "hpa" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fathom.fullname" . }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fathom.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetRequestsPerSecond | quote }}
{{- end }}
