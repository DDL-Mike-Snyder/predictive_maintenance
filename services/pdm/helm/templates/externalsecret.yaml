{{/*
09-monorepo-and-conventions.md §4.5: secrets arrive as environment variables
projected from an External Secrets-managed Secret -- never a file path in
the chart, never a value in values.yaml. FATHOM_DATABASE__URL (a full DSN
with embedded credentials) is the only genuinely secret value this service
needs; everything else is in configmap.yaml.

Backend assumed here: HashiCorp Vault via a SecretStore named `fathom-vault`
in this namespace (not specified by any build doc as of this writing --
concrete choice made here so the chart has something real to render and
lint; swap the `secretStoreRef`/`remoteRef` below if the platform team picks
a different ClusterSecretStore or KV path convention).

The target Secret's key is named exactly `FATHOM_DATABASE__URL` so the
Deployment's plain `envFrom: - secretRef:` projects it as that env var
verbatim, with no per-key remapping in the Deployment itself.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.database.secretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_DATABASE__URL
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/database
        property: url
