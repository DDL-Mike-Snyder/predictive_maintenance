{{/*
09-monorepo-and-conventions.md §4.5: secrets arrive as environment variables
projected from an External Secrets-managed Secret -- never a file path in
the chart, never a value in values.yaml. FATHOM_DATABASE__URL (a full DSN
with embedded credentials) is the only genuinely secret value this service
needs; everything else is in configmap.yaml.

Backend assumed here: HashiCorp Vault via a SecretStore named `fathom-vault`
in this namespace (not specified by any build doc as of this writing --
concrete choice made here so the chart has something real to render and
lint; swap the `secretStoreRef`/`remoteRef` below if the platform team picks
a different ClusterSecretStore or KV path convention).

The target Secret's key is named exactly `FATHOM_DATABASE__URL` so the
Deployment's/migration Job's plain `envFrom: - secretRef:` projects it as
that env var verbatim, with no per-key remapping.

Renders TWO ExternalSecrets, deliberately from two different Vault paths:
the app's own restricted role (database.secretRef, `.../database`) and a
distinct owner-privilege role migrations need (database.migrationSecretRef,
`.../database-migration`) -- see migration-job.yaml's own docstring for why
these must never be the same credential. The second block is gated on
migrations.enabled too: no migration Job, no need for its Secret.

externalSecret.enabled defaults true (every real environment has the
External Secrets Operator's CRDs installed, per the assumption above) --
false is an escape hatch for an environment that doesn't have them yet
(e.g. a smoke-test sandbox with the Secrets created by hand),
not a real deployment's normal path.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.database.secretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_DATABASE__URL
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/database
        property: url
{{- if .Values.migrations.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.migrationSecretRef }}
  labels: {{- include "fathom.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fathom-vault
    kind: SecretStore
  target:
    name: {{ .Values.database.migrationSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: FATHOM_DATABASE__URL
      remoteRef:
        key: fathom/data/{{ .Values.slug }}/database-migration
        property: url
{{- end }}
{{- end }}
