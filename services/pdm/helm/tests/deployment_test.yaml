suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: is a Deployment wired to the shared ConfigMap and the External-Secrets Secret, never a literal secret value
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: RELEASE-NAME-pdm
            - secretRef:
                name: fathom-pdm-pg-app
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: uses the digest when CI has set one, not the mutable tag
    set:
      image.repository: registry.internal/fathom/pdm
      image.digest: sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/fathom/pdm@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - it: falls back to the tag only when no digest is set (local dev)
    set:
      image.digest: ""
      image.tag: dev-local
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/fathom/pdm:dev-local

  - it: matches values.yaml's replicaCount by default
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: "honors values-dev.yaml's replicaCount: 1"
    values:
      - ../values-dev.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
