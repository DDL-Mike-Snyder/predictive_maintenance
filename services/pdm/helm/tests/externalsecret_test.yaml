# 09-monorepo-and-conventions.md §4.5: the one genuinely secret value,
# FATHOM_DATABASE__URL, arrives as an env var projected from an External
# Secrets-managed Secret -- never a file path in the chart, never a value
# in values.yaml. This asserts the ExternalSecret produces a Secret whose
# key the Deployment's envFrom/secretRef can project verbatim, and that no
# real DSN or credential value is ever written into the chart itself.
suite: ExternalSecret projects FATHOM_DATABASE__URL, never a literal value
templates:
  - externalsecret.yaml
tests:
  - it: is an ExternalSecret targeting database.secretRef, sourced from the fathom-vault SecretStore
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1beta1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: fathom-pdm-pg-app
      - equal:
          path: spec.secretStoreRef
          value:
            name: fathom-vault
            kind: SecretStore
      - equal:
          path: spec.target.name
          value: fathom-pdm-pg-app
      - equal:
          path: spec.data[0].secretKey
          value: FATHOM_DATABASE__URL
      - notExists:
          path: spec.data[0].value
      - notMatchRegex:
          path: spec.data[0].remoteRef.key
          pattern: "postgresql"

  - it: follows database.secretRef when overridden, not a hardcoded name
    set:
      database.secretRef: some-other-secret-name
    asserts:
      - equal:
          path: metadata.name
          value: some-other-secret-name
      - equal:
          path: spec.target.name
          value: some-other-secret-name
