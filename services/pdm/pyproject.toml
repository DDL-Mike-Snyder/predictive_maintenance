[project]
name = "fathom-pdm"
version = "0.1.0"
description = "FATHOM Predictive Maintenance service (docs/build/22-pdm.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "fathom-canonical-schemas",
    "fathom-contracts",
    "fathom-py-common",
    "fathom-sync",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "testcontainers>=4.15",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_pdm"]

[tool.uv.sources]
fathom-canonical-schemas = { path = "../../packages/canonical-schemas", editable = true }
fathom-contracts = { path = "../../packages/contracts", editable = true }
fathom-py-common = { path = "../../packages/py-common", editable = true }
fathom-sync = { path = "../../packages/py-sync", editable = true }
