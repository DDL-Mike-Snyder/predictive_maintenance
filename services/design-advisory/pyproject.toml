[project]
name = "fathom-design-advisory"
version = "0.1.0"
description = "FATHOM Design Advisory -- Redesign Case Builder demo (docs/demo/redesign-case-builder-demo-plan.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_design_advisory"]
