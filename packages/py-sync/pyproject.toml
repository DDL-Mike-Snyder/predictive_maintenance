[project]
name = "fathom-sync"
version = "0.1.0"
description = "FATHOM outbox/inbox library (docs/build/11-outbox-sync-library.md)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "fathom-canonical-schemas",
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "testcontainers>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_sync"]

[tool.uv.sources]
fathom-canonical-schemas = { path = "../canonical-schemas", editable = true }
