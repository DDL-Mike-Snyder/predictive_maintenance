[project]
name = "fathom-py-common"
version = "0.1.0"
description = "FATHOM shared FastAPI middleware, problem details, idempotency, ETag, health, logging (09-monorepo-and-conventions.md §5)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "fathom-canonical-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_py_common"]

[tool.uv.sources]
fathom-canonical-schemas = { path = "../canonical-schemas", editable = true }
