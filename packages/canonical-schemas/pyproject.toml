[project]
name = "fathom-canonical-schemas"
version = "0.1.0"
description = "FATHOM shared kernel and payload schemas (03 §7, 03 §5.5)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_schemas"]
