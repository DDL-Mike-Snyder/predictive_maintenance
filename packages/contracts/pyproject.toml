[project]
name = "fathom-contracts"
version = "0.1.0"
description = "FATHOM operation-annotation decorator and conformance suites (03 §4.1, §10)"
requires-python = ">=3.12"
dependencies = [
    "fathom-canonical-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_contracts"]

[tool.uv.sources]
fathom-canonical-schemas = { path = "../canonical-schemas", editable = true }
